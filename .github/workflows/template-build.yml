on:
  workflow_call:
    inputs:
      release-tag-name:
        required: true
        type: string
      push:
        required: true
        type: boolean

env:
  PLATFORMS: linux/amd64,linux/arm64
  imageName: harvester-kubeovn-operator

jobs:
  dapper-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Run build and test
        run: make

      - name: Docker Build
        if: ${{ inputs.push == false }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          provenance: false
          context: .
          platforms: ${{ env.PLATFORMS }}
          file: Dockerfile
          push: false
          tags: ${{ env.imageName }}:${{ inputs.release-tag-name }}

      - name: Resolve registries
        id: resolve
        if: ${{ inputs.push == true }}
        uses: harvester/harvester-actions/actions/resolve-registries@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main
        with:
          release-tag-name: ${{ inputs.release-tag-name }}
          is-release: ${{ github.event_name == 'release' && github.event.action == 'published' }}

      - name: Set image tag
        if: ${{ inputs.push == true }}
        run: echo "IMAGE_TAG=${RELEASE_TAG_NAME#prime-}" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}

      - name: Login to Docker Hub
        id: login-docker
        if: ${{ inputs.push == true && steps.resolve.outputs.use-docker-io == 'true' }}
        uses: harvester/harvester-actions/actions/login-docker-hub@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main

      - name: Publish public ${{ env.imageName }} image
        if: ${{ inputs.push == true && steps.resolve.outputs.use-docker-io == 'true' }}
        uses: harvester/harvester-actions/actions/publish-public-image@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main
        with:
          context: .
          dockerfile: Dockerfile
          image: ${{ env.imageName }}
          tag: ${{ env.IMAGE_TAG }}
          platforms: ${{ env.PLATFORMS }}
          registry: ${{ steps.login-docker.outputs.registry }}
          repository: ${{ steps.login-docker.outputs.repository }}

      - name: Login to Staging Registry
        id: login-staging
        if: ${{ inputs.push == true && steps.resolve.outputs.use-staging == 'true' }}
        uses: harvester/harvester-actions/actions/login-staging-registry@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main

      - name: Publish staging ${{ env.imageName }} image
        if: ${{ inputs.push == true && steps.resolve.outputs.use-staging == 'true' }}
        uses: harvester/harvester-actions/actions/publish-prime-image@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main
        with:
          context: .
          dockerfile: Dockerfile
          image: ${{ env.imageName }}
          tag: ${{ env.IMAGE_TAG }}
          platforms: ${{ env.PLATFORMS }}
          registry: ${{ steps.login-staging.outputs.registry }}
          repository: ${{ steps.login-staging.outputs.repository }}

      - name: Login to Prime Registry
        id: login-prime
        if: ${{ inputs.push == true && steps.resolve.outputs.use-prime == 'true' }}
        uses: harvester/harvester-actions/actions/login-prime-registry@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main

      - name: Publish prime ${{ env.imageName }} image
        if: ${{ inputs.push == true && steps.resolve.outputs.use-prime == 'true' }}
        uses: harvester/harvester-actions/actions/publish-prime-image@f9d3081c0b7241e65cc2ffe8701a5e7ffd4c5ee2 # main
        with:
          context: .
          dockerfile: Dockerfile
          image: ${{ env.imageName }}
          tag: ${{ env.IMAGE_TAG }}
          platforms: ${{ env.PLATFORMS }}
          registry: ${{ steps.login-prime.outputs.registry }}
          repository: ${{ steps.login-prime.outputs.repository }}
