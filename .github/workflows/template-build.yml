on:
  workflow_call:
    inputs:
      release-tag-name:
        required: true
        type: string
      push:
        required: true
        type: boolean

env:
  PLATFORMS: linux/amd64,linux/arm64
  imageName: harvester-kubeovn-operator

jobs:
  dapper-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Run build and test
        run: make

      - name: Docker Build
        if: ${{ inputs.push == false }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          provenance: false
          context: .
          platforms: ${{ env.PLATFORMS }}
          file: Dockerfile
          push: false
          tags: ${{ env.imageName }}:${{ inputs.release-tag-name }}

      - name: Build and publish ${{ env.imageName }} image
        if: ${{ inputs.push == true }}
        uses: harvester/harvester-actions/actions/build-and-publish@18134d283bc63c5a7ffb25191e6cd2f367a10932 # main
        with:
          release-tag-name: ${{ inputs.release-tag-name }}
          dockerfile: Dockerfile
          image: ${{ env.imageName }}
